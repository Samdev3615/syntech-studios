<svg width="400" height="100" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- OPTION C : Symbole de Création/Transformation -->
  <!-- Style : Créatif, Figma/Notion-like -->

  <defs>
    <linearGradient id="gradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon : Forme abstraite évoquant création/évolution -->
  <g transform="translate(10, 20)">
    <!-- Triangle de base (construction) -->
    <path d="M 30 15 L 45 45 L 15 45 Z"
          fill="url(#gradC)" opacity="0.8"/>

    <!-- Cercle (perfection, design) -->
    <circle cx="35" cy="35" r="12"
            fill="none" stroke="url(#gradC)" stroke-width="3"/>

    <!-- Carré (structure, tech) -->
    <rect x="25" y="50" width="20" height="10" rx="2"
          fill="url(#gradC)" opacity="0.9"/>

    <!-- Ligne de connexion (transformation) -->
    <line x1="30" y1="45" x2="40" y2="55"
          stroke="url(#gradC)" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Texte "SynTech" -->
  <text x="75" y="50"
        font-family="'SF Pro Display', -apple-system, 'Segoe UI', sans-serif"
        font-size="32"
        font-weight="600"
        fill="#ffffff"
        letter-spacing="-1">SynTech</text>

  <!-- Sous-texte "Studios" -->
  <text x="75" y="70"
        font-family="'SF Pro Display', -apple-system, 'Segoe UI', sans-serif"
        font-size="14"
        font-weight="500"
        fill="#71717a"
        letter-spacing="3">STUDIOS</text>
</svg>
