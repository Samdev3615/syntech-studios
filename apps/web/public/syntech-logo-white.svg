<svg width="400" height="100" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- SynTech Studios Logo - Version Blanche (Fond Foncé) -->

  <!-- Icon : Formes géométriques -->
  <g id="logo-mark-white" transform="translate(12, 22)">
    <!-- Forme 1 -->
    <rect x="0" y="0" width="30" height="30" rx="7"
          fill="#ffffff" opacity="0.85"/>

    <!-- Forme 2 -->
    <rect x="18" y="18" width="28" height="28" rx="6"
          fill="#ffffff" opacity="0.7"/>

    <!-- Forme 3 -->
    <rect x="32" y="32" width="24" height="24" rx="5"
          fill="#ffffff"/>

    <!-- Lignes de connexion -->
    <line x1="15" y1="15" x2="32" y2="32"
          stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
    <line x1="32" y1="32" x2="44" y2="44"
          stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Texte "SynTech" -->
  <text x="80" y="48"
        font-family="'SF Pro Display', -apple-system, 'Segoe UI', 'Inter', sans-serif"
        font-size="34"
        font-weight="600"
        fill="#ffffff"
        letter-spacing="-1.2">SynTech</text>

  <!-- Sous-texte "Studios" -->
  <text x="80" y="68"
        font-family="'SF Pro Display', -apple-system, 'Segoe UI', 'Inter', sans-serif"
        font-size="14"
        font-weight="500"
        fill="#a1a1aa"
        letter-spacing="4">STUDIOS</text>
</svg>
